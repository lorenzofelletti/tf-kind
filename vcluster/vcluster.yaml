controlPlane:
  proxy:
    extraSANs:
    - ${CLUSTER_NAMESPACE}.${LOCAL_DOMAIN}
  ingress:
    enabled: true
    host: ${CLUSTER_NAMESPACE}.${LOCAL_DOMAIN}
    spec:
      ingressClassName: nginx
sync:
  toHost:
    serviceAccounts:
      enabled: true
  fromHost:
    nodes:
      enabled: true
      clearImageStatus: true
exportKubeConfig:
  server: https://${CLUSTER_NAMESPACE}.${LOCAL_DOMAIN}:443
  secret:
    name: ${CLUSTER_NAME}-ext-kubeconfig
